[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finplan-rag"
version = "0.1.0"
description = "Point-in-time, obligation-aware retrieval planning for financial RAG."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=8"]
experiments = ["scikit-learn>=1.3", "scipy>=1.10", "pandas>=2.0", "jsonlines>=3", "tiktoken>=0.7", "tqdm>=4.65"]
agent = ["mcp>=2.0", "requests>=2.31", "lxml>=4.9", "PyYAML>=6", "pymupdf>=1.24"]

[project.scripts]
finplan-controlled = "finplan_rag.controlled_planning:main"
finplan-rag-agent = "finplan_rag.agent_adapter:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
