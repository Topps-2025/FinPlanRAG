[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finplan-rag"
version = "0.1.0"
description = "Point-in-time, obligation-aware retrieval planning for financial RAG."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
finplan-controlled = "finplan_rag.controlled_planning:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
